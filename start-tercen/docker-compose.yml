# PODMAN-DIRECT: no dind. Each tercen service runs its own podman
# (podman-init.sh starts the podman system service inside the container at
# /run/podman/podman.sock — the same model as the production worker chart).
# Nothing is shared between services except tercen-data.

networks:
  tercen:
    ipam:
      driver: default
      config:
        - subnet: 172.42.0.0/16

services:

  postgres:
    networks:
      tercen:
        aliases:
          - postgres
    image: postgres:16
    environment:
      - POSTGRES_USER=tercen
      - POSTGRES_PASSWORD=tercen
      - POSTGRES_DB=tercen
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tercen -d tercen"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  redis:
    networks:
      tercen:
        aliases:
          - redis
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "admin"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a admin ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  scheduler:
    networks:
      tercen:
        aliases:
          - scheduler
    image: tercen/ha-scheduler:0.33.0
    environment:
      - RUST_LOG=info,sci_ha_scheduler_rust=info
      - REDIS_SENTINELS=redis:6379
      - REDIS_SERVICE_NAME=redis
      - REDIS_PASSWORD=admin
      - GRPC_PORT=50051
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  tercen:
    # privileged: podman-init needs cgroup v2 delegation; runs as root until
    # podman-init drops to 1000 (no user: key — podman-init exits otherwise)
    privileged: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      tercen:
        ipv4_address: 172.42.0.42
        aliases:
          - tercen
    image: tercen/tercen:${TERCEN_IMAGE_TAG}
    # DEVIATION from fable's spec (evidence-backed): the container-local
    # podman store survives `compose restart` and crash-restarts, and
    # container_manager only skips an already-RUNNING sarno — a stopped
    # leftover re-collides on the fixed name and crash-loops forever. The
    # pre-step is not dind-era; it is the restart-safety net.
    entrypoint: ["/bin/sh", "-c", "podman stop -t 0 sarno 2>/dev/null; podman rm -f sarno 2>/dev/null; exec /usr/local/bin/podman-init.sh /app/bin/tercen"]
    environment:
      # main spawns its own sarno container — pin it explicitly or it falls
      # back to the image default
      - TERCEN_SARNO_IMAGE=docker.io/tercen/sarno:${SARNO_IMAGE_TAG}
      # optional ghcr auth + renv PAT (only safe on >=1.1.10: launch-line
      # redaction); empty = unset behaviour
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    ports:
      - 5400:5400
      - 50051:50051
    volumes:
      # shared cache: operator tree + renv cache + uploads (bootstrapRenv
      # writes rw, run containers mount ro)
      - tercen-data:/var/lib/tercen/data
      - ./config/tercen:/etc/tercen
    restart: always

  # worker-mode tercen: claims tasks from the HA scheduler and runs operator
  # containers through its OWN container-local podman store
  tercen-worker:
    privileged: true
    depends_on:
      - tercen
    networks:
      tercen:
        ipv4_address: 172.42.0.43
        aliases:
          - tercen-worker
    image: tercen/tercen:${TERCEN_IMAGE_TAG}
    environment:
      - TERCEN_SARNO_IMAGE=docker.io/tercen/sarno:${SARNO_IMAGE_TAG}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./config/worker:/etc/tercen
      - tercen-data:/var/lib/tercen/data
    restart: always


volumes:
  pg-data:
  tercen-data:
