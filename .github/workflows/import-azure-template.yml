# Sartorius Azure template import leg — the customer's GitProjectTask flow
# (wizard shape) against a FRESH instance, driven ENTIRELY by tercenctl:
#   project create --gitUrl <azure repo>   (GIT_URL meta set at create —
#     exactly what the UI wizard does; tercenctl >= 0.12.0)
#   git pull (RESET_PULL GitProjectTask; GIT_PAT task meta is encrypted
#     server-side) → DoneState → worker writes GIT_COMMIT back onto the
#     project; tercenctl -w polls and prints '  Current commit: <sha>'.
#
# IMAGE TAG LESSON (run 36198962698 + probe): tercen/tercenctl:release is a
# STALE hand-pushed tag (~Nov 2025) — it has NO `git` and NO `project`
# command at all. Real images are the bare version tags published by the
# tercenctl-v* release pipeline (.github/workflows/tercen-ctl.yml in sci).
# Pin the explicit version; never :release. 0.12.0 = current (2026-09-21).
#
# The worker's Git wrapper embeds the token as URL userinfo `pat:<token>`
# (sci_git.dart L15) — valid for Azure DevOps https clones (any username,
# PAT as password). skipLfs: true in _cloneGit, so the repo's LFS TestData
# never enters the picture.
#
# TOKEN AVAILABILITY: AZ_SRT_TOKEN reaches this repo (the 36198962698 guard
# passed). It FAILS CLOSED with a length-only print; the run cannot
# silently degrade to anonymous. The token value NEVER appears in logs:
# passed via env into tercenctl only; GIT_PAT task meta is encrypted
# server-side (task_service _ensureSecret strips it).
name: import-azure-template

on:
  workflow_dispatch:
    inputs:
      tercen-tag:
        description: 'tercen/tercen image tag to boot the fresh instance with'
        required: false
        default: '1.1.10'
      ctl-tag:
        description: 'tercen/tercenctl image tag (needs git + project create --gitUrl)'
        required: false
        default: '0.12.0'
  push:
    branches: [feature/azure-template-import]

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      AZURE_REPO_URL: https://dev.azure.com/sartorius-lps/lps_ingenix_modules/_git/lps_tercen_phenotyping_template
      CTL_TAG: ${{ github.event.inputs.ctl-tag || '0.12.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — Azure PAT must be present (fail closed, length only)
        env:
          AZ_TOKEN_VALUE: ${{ secrets.AZ_SRT_TOKEN }}
        run: |
          if [ -z "$AZ_TOKEN_VALUE" ]; then
            echo "::error::AZ_SRT_TOKEN is empty here — secret not available to tercen/actions. The import cannot run anonymous; fix the secret access first."
            exit 1
          fi
          echo "AZ_SRT_TOKEN present (length $(printf %s "$AZ_TOKEN_VALUE" | wc -c))"

      - name: Start fresh Tercen instance
        uses: ./start-tercen
        with:
          branch: ${{ github.event.inputs.tercen-tag || '1.1.10' }}
          sarno-tag: '1.2.5'

      - name: Create project with GIT_URL meta (wizard shape)
        # shell: bash => -eo pipefail (a nonzero tercenctl exit must fail the
        # step even through tee). -f json -q => the log is pure JSON; the ID
        # parse below fails closed with the full log if the shape surprises.
        shell: bash
        run: |
          docker run --net=host --rm \
            -e TERCEN_USERNAME=test \
            -e TERCEN_PASSWORD=test \
            -e TERCEN_URI=http://172.42.0.42:5400 \
            "tercen/tercenctl:$CTL_TAG" project create \
            -n lps_tercen_phenotyping_template \
            -u "$AZURE_REPO_URL" \
            -f json -q 2>&1 | tee project-create.log
          PROJECT_ID="$(jq -r '.id // .project.id // empty' project-create.log 2>/dev/null || true)"
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "::error::could not parse project id from create output:"; cat project-create.log; exit 1
          fi
          echo "project created: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Pull the template (RESET_PULL GitProjectTask)
        shell: bash
        env:
          AZ_TOKEN_VALUE: ${{ secrets.AZ_SRT_TOKEN }}
        run: |
          docker run --net=host --rm \
            -e TERCEN_USERNAME=test \
            -e TERCEN_PASSWORD=test \
            -e TERCEN_URI=http://172.42.0.42:5400 \
            "tercen/tercenctl:$CTL_TAG" git pull \
            -p "$PROJECT_ID" \
            --token "$AZ_TOKEN_VALUE" \
            --branch main --wait 2>&1 | tee git-pull.log

      - name: Assert — DoneState + GIT_COMMIT written back
        # tercenctl's -w poll prints '✓ Git pull completed successfully' on
        # DoneState and re-reads the project to print '  Current commit:'
        # from the GIT_COMMIT meta the worker wrote back. Fail closed on
        # BOTH: DoneState alone doesn't prove the write-back.
        shell: bash
        run: |
          grep -q "Git pull completed successfully" git-pull.log || {
            echo "::error::git pull did not reach DoneState (tercenctl prints '✓ Git pull completed successfully')"; tail -10 git-pull.log; exit 1; }
          commit_line="$(grep -m1 'Current commit:' git-pull.log || true)"
          if [ -z "$commit_line" ]; then
            echo "::error::no 'Current commit:' line — worker reached DoneState but GIT_COMMIT is not on the project (write-back missing)"; exit 1
          fi
          echo "import complete: $commit_line"

      - name: Capture service logs (diagnostics for any failure surface)
        if: always()
        run: |
          docker compose -f start-tercen/docker-compose.yml logs --no-color tercen > tercen.log || true
          docker compose -f start-tercen/docker-compose.yml logs --no-color tercen-worker > worker.log || true
          wc -l tercen.log worker.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-import-logs
          path: |
            project-create.log
            git-pull.log
            tercen.log
            worker.log
